<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="app-version" content="1.0.0">
<meta name="theme-color" content="#b84d1f">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Burger Shop</title>
<style>
:root{color-scheme:light;--bg:#f7f0e6;--card:#fffaf3;--card2:#f0e6d8;--tx:#2b2119;--mut:#6b5a4c;--ac:#b84d1f;--acx:#fff;--ln:#e0d2bf;--ok:#1f7a2e;--wa:#9a6200;--er:#b3261e;--in:#1d5aa6;--okb:#e0f2e1;--wab:#fbefcf;--erb:#fbe0dd;--inb:#dde9f8}
:root[data-theme=dark]{color-scheme:dark;--bg:#17120e;--card:#241d17;--card2:#2f261e;--tx:#f4eadc;--mut:#b9a998;--ac:#e8825a;--acx:#1b0f08;--ln:#43372b;--ok:#79d17f;--wa:#ecc062;--er:#ff8a80;--in:#7db4f2;--okb:#1d3320;--wab:#3a2e12;--erb:#432120;--inb:#18304c}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#17120e;--card:#241d17;--card2:#2f261e;--tx:#f4eadc;--mut:#b9a998;--ac:#e8825a;--acx:#1b0f08;--ln:#43372b;--ok:#79d17f;--wa:#ecc062;--er:#ff8a80;--in:#7db4f2;--okb:#1d3320;--wab:#3a2e12;--erb:#432120;--inb:#18304c}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{zoom:.92}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{min-height:44px;border:1px solid var(--ln);background:var(--card);border-radius:10px;padding:0 12px;cursor:pointer;font-weight:600}
button:active{transform:scale(.98)}
button.pri{background:var(--ac);color:var(--acx);border-color:var(--ac)}
button.ok{background:var(--ok);color:var(--bg);border-color:var(--ok)}
button.dng{color:var(--er);border-color:var(--er)}
button.sm{min-height:44px;padding:0 10px}
button[disabled]{opacity:.45;cursor:default}
input,select,textarea{min-height:44px;width:100%;border:1px solid var(--ln);background:var(--card);border-radius:10px;padding:6px 10px}
input::placeholder,textarea::placeholder{color:var(--mut);opacity:.9}
textarea{min-height:64px}
label.f{display:block;font-size:12px;color:var(--mut);font-weight:600}
label.f input,label.f select{margin-top:2px;color:var(--tx);font-weight:400;font-size:14px}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--ln);padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.brand{font-weight:800;font-size:17px}
.hr{display:flex;align-items:center;gap:8px}.hr small{color:var(--mut);font-size:12px}
.m{white-space:nowrap}
.sum{font-weight:800;color:var(--ac);font-size:16px}
main{max-width:1100px;margin:0 auto;padding:10px 12px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px;margin-bottom:10px}
h2{font-size:16px;margin:14px 0 6px}h3{font-size:14px;margin:12px 0 6px}
.muted{color:var(--mut);font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}.grow{flex:1;min-width:0}
.seg{display:flex;gap:6px;margin:0 0 10px;flex-wrap:wrap}.seg button{flex:1;min-width:0;padding:0 6px;font-size:13px}
.seg button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips button{min-height:44px;border-radius:22px;font-size:13px;padding:0 12px;white-space:nowrap}
.chips button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.cnt{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--card2);font-size:12px;margin-left:4px}
.on .cnt{background:rgba(255,255,255,.28)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.tile{position:relative;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px 6px;text-align:center;min-height:96px;cursor:pointer;user-select:none}
.tile .em{font-size:30px;display:block}.tile .nm{font-size:13px;display:block;font-weight:600}.tile .pr{color:var(--ac);font-weight:800;font-size:13px}
.tile.off{opacity:.45;cursor:default}
.tile .bd{position:absolute;top:4px;right:4px;background:var(--ac);color:var(--acx);border-radius:12px;min-width:24px;height:24px;line-height:24px;font-size:13px;font-weight:700}
.tile .mn{position:absolute;top:0;left:0;width:44px;min-height:44px;border:0;background:transparent;font-size:20px;color:var(--er)}
.cartbar{position:sticky;bottom:calc(66px + env(safe-area-inset-bottom));margin-top:10px;z-index:10}
.cartbar button{width:100%;min-height:52px;display:flex;justify-content:space-between;padding:0 16px;font-size:15px}
.ord{border-left:6px solid var(--in)}.ord.cook{border-left-color:var(--wa)}.ord.ready{border-left-color:var(--ok)}.ord.late{background:var(--erb)}
.badge{display:inline-block;border-radius:10px;padding:2px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.b-ok{background:var(--okb);color:var(--ok)}.b-wa{background:var(--wab);color:var(--wa)}.b-er{background:var(--erb);color:var(--er)}.b-in{background:var(--inb);color:var(--in)}.b-gr{background:var(--card2);color:var(--mut)}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.kpi>div{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px}.kpi small{color:var(--mut);font-size:12px;display:block}.kpi b{font-size:17px;white-space:nowrap}
.bar{height:10px;background:var(--card2);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.bar.ok i{background:var(--ok)}.bar.wa i{background:var(--wa)}.bar.er i{background:var(--er)}
.chart{display:flex;align-items:flex-end;gap:2px;height:110px;padding:6px;background:var(--card);border:1px solid var(--ln);border-radius:12px}
.chart i{flex:1;background:var(--ac);border-radius:3px 3px 0 0;min-height:2px}.chart i.we{background:var(--in)}
.step{display:flex;align-items:center;gap:6px}.step button{width:44px;padding:0;font-size:20px}.step b{min-width:54px;text-align:center}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:5px 4px;border-bottom:1px solid var(--ln);text-align:right}td:first-child,th:first-child{text-align:left}
.heat{display:grid;grid-template-columns:28px repeat(14,1fr);gap:2px;font-size:10px;color:var(--mut)}
.heat div{height:26px;border-radius:4px;display:flex;align-items:center;justify-content:center}
.heat .c{background:color-mix(in srgb,var(--ac) calc(var(--p)*1%),var(--card2));color:var(--tx)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:transparent;min-height:58px;font-size:11px;position:relative;color:var(--mut);padding:0 2px}
nav button b{display:block;font-size:20px;line-height:1.1}nav button.on{color:var(--ac)}
nav .nb{position:absolute;top:4px;left:50%;margin-left:6px;background:var(--er);color:#fff;border-radius:9px;font-size:11px;min-width:18px;height:18px;line-height:18px}
#toast{position:fixed;left:12px;right:12px;bottom:calc(70px + env(safe-area-inset-bottom));z-index:60;background:var(--tx);color:var(--bg);border-radius:12px;padding:6px 8px 6px 14px;display:none;align-items:center;justify-content:space-between;gap:8px;max-width:520px;margin:0 auto}
#toast.show{display:flex}#toast button{background:transparent;color:var(--bg);border-color:var(--bg)}
#sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center}
#sheet.show{display:flex}
.sh{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 12px calc(14px + env(safe-area-inset-bottom))}
.ing{border:1px solid var(--ln);border-radius:10px;padding:8px;margin-bottom:8px;background:var(--card)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
details>summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:700}
.two{display:block}.two .col+.col{margin-top:0}
.sub-only{display:block}
@media (min-width:860px){.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}.sub-only{display:none}.cartbar{bottom:12px}#toast{bottom:12px}.tiles{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
</style>
</head>
<body>
<header><div class="brand">🍔 Burger Shop</div><div class="hr"><small>Сегодня</small><span class="sum" id="hsum"></span><button id="thm" class="sm" data-a="theme" aria-label="Тема">🌙</button></div></header>
<main id="main"></main>
<div id="toast"><span id="tmsg"></span><button id="tund">Отменить</button></div>
<div id="sheet"><div class="sh" id="shc"></div></div>
<nav id="nav"></nav>

<script>
'use strict';
/* ===== утилиты ===== */
const KEY='burger-app-v2',DAY=864e5;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf=new Intl.NumberFormat('ru-RU');
const mt=n=>nf.format(Math.round(n||0))+' ₫';
const money=n=>'<span class="m">'+mt(n)+'</span>';
const q2=n=>String(+(+n||0).toFixed(2)).replace('.',',');
const startDay=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const endDay=t=>startDay(t)+DAY-1;
const dd=t=>{const d=new Date(t);return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')};
const hm=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const isoDay=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const sum=(a,f)=>a.reduce((s,x)=>s+(+f(x)||0),0);

/* ===== данные ===== */
const DEFCATS=[{id:'food',em:'🥩',name:'Продукты'},{id:'chem',em:'🧴',name:'Бытовая химия'},{id:'pack',em:'📦',name:'Упаковка'},{id:'cons',em:'🧻',name:'Расходники'},{id:'other',em:'🔧',name:'Прочее'}];
const OPEX=['Аренда','Зарплата','Коммунальные','Реклама','Связь','Оборудование','Налоги','Прочее'];
const PURCH=['Закупка продуктов','Закупка упаковки и химии'];
const INCAT=['Взнос в кассу','Прочий приход'];
const REASONS=['Порча','Брак','Угощение','Пролив','Срок годности','Другое'];
const ST=['new','cook','ready','sold'];
const STN={new:'Новый',cook:'Готовится',ready:'Готов',sold:'Продан'};
const NEXT={new:'Начать готовить',cook:'Готов',ready:'Продан'};
function blank(){return{menu:[
 {id:1,em:'🍔',name:'Классический',price:85000,cost:30000,on:true},
 {id:2,em:'🍟',name:'Картофель фри',price:45000,cost:12000,on:true},
 {id:3,em:'🥤',name:'Кола 0,33',price:25000,cost:9000,on:true}],
 cats:DEFCATS.map(c=>({...c})),stock:[],preps:[],orders:[],fin:[],losses:[],shifts:[],
 seq:{menu:4,stock:1,order:1,prep:1,fin:1,cat:100,loss:1,shift:1}}}
function norm(s){const d=blank();s=Object.assign(d,s||{});
 ['menu','stock','preps','orders','fin','losses','shifts'].forEach(k=>{if(!Array.isArray(s[k]))s[k]=[]});
 if(!Array.isArray(s.cats)||!s.cats.length)s.cats=DEFCATS.map(c=>({...c}));
 s.seq=Object.assign({menu:1,stock:1,order:1,prep:1,fin:1,cat:100,loss:1,shift:1},s.seq||{});
 s.menu.forEach(m=>{m.tc=m.tc||{time:0,steps:'',ings:[]};m.tc.ings=m.tc.ings||[];m.pack=m.pack||[];m.on=m.on!==false;m.cost=+m.cost||0;m.price=+m.price||0;m.em=m.em||'🍽️'});
 s.stock.forEach(i=>{i.cat=i.cat||'food';i.price=+i.price||0;i.min=+i.min||0;i.qty=+i.qty||0});
 s.preps.forEach(p=>{p.qty=+p.qty||0;p.par=+p.par||0;p.batch=+p.batch||1;p.shelf=+p.shelf||1;p.exp=p.exp||null});
 s.orders.forEach(o=>{o.deducted=o.deducted||[];o.pay=o.pay||'cash';o.items=o.items||[]});
 return s}
function load(){try{const r=localStorage.getItem(KEY);if(r)return norm(JSON.parse(r))}catch(e){}return norm(blank())}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const ui={tab:'orders',osub:'new',of:'all',cart:{},ck:{client:'',type:'here',note:'',pay:'cash'},sheet:null,
 sr:'today',ssub:'sales',fr:'week',hr:'month',mmode:'dishes',scat:'all',ff:{type:'out',cat:OPEX[0],sum:'',note:''},
 sh:{float:'',counted:'',note:''},ns:{name:'',qty:'',unit:'шт',min:'',cat:'food',price:''},np:{name:'',par:'',batch:'',shelf:''},nd:{em:'🍽️',name:'',price:''},resetArm:false};

/* ===== расчёты ===== */
function calcTC(tc){let out=0,cost=0,k=0,p=0,f=0,c=0;
 for(const i of (tc&&tc.ings)||[]){const q=+i.qty||0,pc=+i.price||0;let mass,m;
  if(i.unit==='шт'){mass=q*(+i.w||0);cost+=q*pc;m=q}else{mass=q;cost+=q/1000*pc;m=q/100}
  k+=m*(+i.kcal||0);p+=m*(+i.p||0);f+=m*(+i.f||0);c+=m*(+i.c||0);out+=mass}
 return{out,cost,k,p,f,c,k100:out?k/out*100:0,p100:out?p/out*100:0,f100:out?f/out*100:0,c100:out?c/out*100:0}}
const stockBy=id=>S.stock.find(x=>x.id===id);
const packCost=m=>sum(m.pack||[],x=>{const s=stockBy(x.stockId);return s?s.price*x.qty:0});
const hasTC=m=>m.tc&&m.tc.ings&&m.tc.ings.length>0;
const dishCost=m=>(hasTC(m)?calcTC(m.tc).cost:m.cost)+packCost(m);
const stepOf=u=>u==='шт'?10:(u==='кг'||u==='л')?.5:1;
const isLow=i=>i.qty<i.min;
function need(i){const n=Math.max(0,i.min*2-i.qty);return i.unit==='шт'?Math.ceil(n):Math.ceil(n*2)/2}
function amountFor(ing,qty){return ing.unit==='шт'?qty:qty/1000}
function deductFor(o){const map={};
 for(const it of o.items){const m=S.menu.find(x=>x.id===it.id);if(!m)continue;
  for(const g of m.tc.ings||[])if(g.stockId){map[g.stockId]=(map[g.stockId]||0)+amountFor(g,+g.qty||0)*it.qty}
  for(const k of m.pack||[])if(k.stockId&&(k.mode==='all'||o.type==='go'))map[k.stockId]=(map[k.stockId]||0)+(+k.qty||0)*it.qty}
 const out=[];for(const id in map){const s=stockBy(+id);if(!s)continue;const a=Math.min(s.qty,map[id]);if(a>0){s.qty=+(s.qty-a).toFixed(4);out.push([s.id,a])}}
 return out}
function restore(o){for(const[id,a]of o.deducted||[]){const s=stockBy(id);if(s)s.qty=+(s.qty+a).toFixed(4)}o.deducted=[]}
const sold=()=>S.orders.filter(o=>o.status==='sold');
const oTotal=o=>sum(o.items,i=>i.price*i.qty);
const oCost=o=>sum(o.items,i=>i.cost*i.qty);
function rangeStart(r){const n=Date.now();return r==='today'?startDay(n):r==='week'?startDay(n)-6*DAY:r==='month'?startDay(n)-29*DAY:0}
const inRange=(arr,f,r)=>{const s=rangeStart(r);return arr.filter(x=>f(x)>=s)};
function prepState(p){
 if(p.qty<=0)return{o:4,t:'Нет в запасе',c:'b-gr'};
 if(!p.exp)return{o:3,t:'Срок не задан',c:'b-gr'};
 const d=Math.round((startDay(p.exp)-startDay(Date.now()))/DAY);
 if(d<0)return{o:0,t:'Просрочено',c:'b-er'};
 if(d===0)return{o:1,t:'Истекает сегодня',c:'b-er'};
 if(d===1)return{o:2,t:'Истекает завтра',c:'b-wa'};
 return{o:3,t:'Годно до '+dd(p.exp),c:'b-ok'}}
const prepStep=p=>(p.unit==='кг'||p.unit==='л')?.5:1;
const prepUrgent=p=>p.qty>0&&p.exp&&prepState(p).o<=2;

/* ===== откат и уведомления ===== */
let tmr=null,undoSnap=null;
function toast(msg,snap){$('#tmsg').textContent=msg;undoSnap=snap||null;$('#tund').style.display=snap?'':'none';$('#toast').classList.add('show');clearTimeout(tmr);tmr=setTimeout(()=>$('#toast').classList.remove('show'),5000)}
$('#tund').onclick=()=>{if(!undoSnap)return;S=norm(JSON.parse(undoSnap));undoSnap=null;save();$('#toast').classList.remove('show');render()};
function act(msg,fn){const snap=JSON.stringify(S);fn();save();render();toast(msg,snap)}
function quiet(fn){fn();save();render()}

/* ===== демо-данные ===== */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function demo(){
 const R=mulberry(20240607),now=Date.now(),T0=startDay(now);
 const s=blank();s.menu=[];s.seq={menu:1,stock:1,order:1,prep:1,fin:1,cat:100,loss:1,shift:1};
 const SK=[ // name,cat,qty,unit,min,price
 ['Говяжий фарш','food',6,'кг',8,220000],['Булочки','food',80,'шт',60,6000],['Сыр чеддер','food',1.5,'кг',2,280000],['Бекон','food',2,'кг',1.5,260000],
 ['Куриное филе','food',4,'кг',3,120000],['Картофель','food',15,'кг',10,25000],['Салат','food',2,'кг',1,40000],['Помидоры','food',3,'кг',2,35000],
 ['Лук','food',2,'кг',1,20000],['Соус фирменный','food',3,'л',2,90000],['Масло для фритюра','food',8,'л',10,50000],['Кола 0,33','food',48,'шт',24,9000],
 ['Средство для посуды','chem',4,'л',3,60000],['Дезинфектор','chem',1,'л',2,120000],['Мыло для рук','chem',2,'л',1,80000],['Мусорные пакеты','chem',3,'уп',2,45000],
 ['Коробка для бургера','pack',120,'шт',200,3500],['Бумага для обёртки','pack',400,'шт',200,500],['Контейнер для фри','pack',90,'шт',100,2000],['Пакет с ручками','pack',300,'шт',150,1500],
 ['Салфетки','cons',900,'шт',500,100],['Перчатки','cons',5,'уп',3,80000],['Приборы (набор)','cons',250,'шт',150,1200]];
 SK.forEach(a=>s.stock.push({id:s.seq.stock++,name:a[0],cat:a[1],qty:a[2],unit:a[3],min:a[4],price:a[5]}));
 const sid=n=>s.stock.find(x=>x.name===n).id;
 const TP={ // name,unit,kcal,p,f,c,price,stock,w
  bun:['Булочка','шт',250,8,4,45,6000,'Булочки',70],beef:['Котлета говяжья','г',250,17,20,0,220000,'Говяжий фарш'],
  cheese:['Сыр чеддер','г',400,25,33,1,280000,'Сыр чеддер'],bacon:['Бекон','г',540,37,42,1.4,260000,'Бекон'],
  chick:['Куриное филе','г',165,31,3.6,0,120000,'Куриное филе'],lett:['Салат','г',15,1.4,.2,2.9,40000,'Салат'],

  h=`<div class="row sp"><h2 style="margin:0">⚙ Разделы склада</h2>${close}</div>`+S.cats.map(c=>{const n=S.stock.filter(i=>i.cat===c.id).length;return`<div class="card row sp"><span>${esc(c.em)} ${esc(c.name)} <span class="muted">· ${n}</span></span><button class="sm dng" data-a="catdel" data-id="${c.id}" ${n?'disabled':''} aria-label="Удалить">🗑</button></div>`}).join('')+`<div class="muted">Удалить можно только пустой раздел.</div><div class="card" style="margin-top:8px"><b>Новый раздел</b><div class="g2" style="margin-top:6px"><label class="f">Эмодзи<input id="nce" value="🛒"></label><label class="f">Название<input id="ncn" placeholder="Например: Напитки"></label></div><button class="pri" style="width:100%;margin-top:8px" data-a="cataddgo">Добавить раздел</button></div>`}
 else if(t==='waste'){const w=ui.sheet,it=w.kind==='stock'?stockBy(w.id):S.preps.find(p=>p.id===w.id);if(!it){ui.sheet=null;return}
  h=`<div class="row sp"><h2 style="margin:0">Списать: ${esc(it.name)}</h2>${close}</div><div class="muted">Остаток ${q2(it.qty)} ${esc(it.unit||'порц')}</div><div class="g2" style="margin:8px 0"><label class="f">Количество<input id="wq" type="number" step="any" value="${w.qty||1}"></label><label class="f">Причина<select id="wr">${REASONS.map(r=>`<option>${r}</option>`).join('')}</select></label></div><button class="pri" style="width:100%" data-a="wgo">Списать</button>`}
 else if(t==='tc'){const m=S.menu.find(x=>x.id===ui.sheet.id);if(!m){ui.sheet=null;return}const c=calcTC(m.tc),fc=m.price?dishCost(m)/m.price*100:0;
  const sopt=(v)=>`<option value="">— нет —</option>`+S.stock.map(s=>`<option value="${s.id}" ${s.id===v?'selected':''}>${esc(catOf(s.cat).em)} ${esc(s.name)} (${esc(s.unit)})</option>`).join('');
  h=`<div class="row sp"><h2 style="margin:0">${esc(m.em)} ${esc(m.name)}</h2>${close}</div>
  <div class="kpi" style="margin-top:8px"><div><small>Выход</small><b>${Math.round(c.out)} г</b></div><div><small>Себестоимость</small><b>${mt(dishCost(m))}</b></div><div><small>Фудкост</small><b style="color:${fc>35?'var(--er)':'var(--ok)'}">${Math.round(fc)}%</b></div><div><small>Наценка</small><b>${dishCost(m)?Math.round((m.price/dishCost(m)-1)*100):0}%</b></div></div>
  <div class="card muted">На порцию: <b>${Math.round(c.k)} ккал</b> · Б ${q2(c.p)} · Ж ${q2(c.f)} · У ${q2(c.c)}<br>На 100 г: ${Math.round(c.k100)} ккал · Б ${q2(c.p100)} · Ж ${q2(c.f100)} · У ${q2(c.c100)}</div>
  <h3>Состав</h3>`+m.tc.ings.map((g,i)=>`<div class="ing"><div class="g3"><label class="f" style="grid-column:span 2">Название<input data-c="ing" data-id="${m.id}" data-i="${i}" data-k="name" value="${esc(g.name)}"></label><label class="f">Кол-во<input type="number" step="any" data-c="ing" data-id="${m.id}" data-i="${i}" data-k="qty" value="${g.qty}"></label></div>
  <div class="g3" style="margin-top:6px"><label class="f">Единица<select data-c="ing" data-id="${m.id}" data-i="${i}" data-k="unit">${['г','мл','шт'].map(u=>`<option ${g.unit===u?'selected':''}>${u}</option>`).join('')}</select></label><label class="f">Цена за ${g.unit==='шт'?'шт':g.unit==='мл'?'л':'кг'}<input type="number" step="any" data-c="ing" data-id="${m.id}" data-i="${i}" data-k="price" value="${g.price||0}"></label>${g.unit==='шт'?`<label class="f">Вес 1 шт, г<input type="number" step="any" data-c="ing" data-id="${m.id}" data-i="${i}" data-k="w" value="${g.w||0}"></label>`:'<div></div>'}</div>
  <div class="g4" style="margin-top:6px">${[['kcal','ккал'],['p','Б'],['f','Ж'],['c','У']].map(n=>`<label class="f">${n[1]}<input type="number" step="any" data-c="ing" data-id="${m.id}" data-i="${i}" data-k="${n[0]}" value="${g[n[0]]||0}"></label>`).join('')}</div><div class="muted">КБЖУ ${g.unit==='шт'?'на 1 шт':'на 100 '+g.unit}</div>
  <div class="row" style="margin-top:6px"><label class="f grow">Склад (списывать)<select data-c="ing" data-id="${m.id}" data-i="${i}" data-k="stockId">${sopt(g.stockId)}</select></label><button class="sm dng" data-a="ingdel" data-id="${m.id}" data-i="${i}" aria-label="Удалить">🗑</button></div></div>`).join('')+
  `<button style="width:100%" data-a="ingadd" data-id="${m.id}">＋ Добавить ингредиент</button>
  <h3>📦 Упаковка и расходники (списываются при продаже)</h3>`+m.pack.map((k,i)=>`<div class="ing"><div class="row"><label class="f grow">Позиция<select data-c="pk" data-id="${m.id}" data-i="${i}" data-k="stockId">${sopt(k.stockId)}</select></label></div><div class="g2" style="margin-top:6px"><label class="f">Кол-во на порцию<input type="number" step="any" data-c="pk" data-id="${m.id}" data-i="${i}" data-k="qty" value="${k.qty}"></label><label class="f">Когда<select data-c="pk" data-id="${m.id}" data-i="${i}" data-k="mode"><option value="go" ${k.mode==='go'?'selected':''}>Только «С собой»</option><option value="all" ${k.mode==='all'?'selected':''}>Всегда</option></select></label></div><button class="sm dng" style="margin-top:6px" data-a="pkdel" data-id="${m.id}" data-i="${i}">Убрать</button></div>`).join('')+
  `<button style="width:100%" data-a="pkadd" data-id="${m.id}">＋ Добавить упаковку</button>
  <h3>Технология</h3><div class="g2"><label class="f">Время, мин<input type="number" data-c="tc" data-id="${m.id}" data-k="time" value="${m.tc.time||0}"></label></div><label class="f" style="margin-top:6px">Описание<textarea data-c="tc" data-id="${m.id}" data-k="steps">${esc(m.tc.steps)}</textarea></label>`}
 c.innerHTML=h;sh.classList.add('show')}

/* ===== действия ===== */
function csvCopy(){const rows=['№;Дата;Клиент;Тип;Оплата;Состав;Сумма'];inRange(sold(),o=>o.sold,ui.sr).forEach(o=>rows.push([o.num,dd(o.sold)+' '+hm(o.sold),'"'+(o.client||'').replace(/"/g,'""')+'"',o.type==='go'?'С собой':'На месте',o.pay==='card'?'Карта':'Нал','"'+o.items.map(i=>i.qty+'x '+i.name).join(', ')+'"',oTotal(o)].join(';')));return rows.join('\n')}
async function copyText(t){try{await navigator.clipboard.writeText(t);return true}catch(e){const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch(x){}a.remove();return ok}}
function restoreData(txt){let d;try{d=JSON.parse(txt)}catch(e){toast('Не удалось прочитать копию');return}
 if(!d||!Array.isArray(d.menu)||!Array.isArray(d.orders)||!Array.isArray(d.stock)){toast('Это не резервная копия приложения');return}
 act('Данные восстановлены',()=>{S=norm(d)})}
const bkText=()=>JSON.stringify(S);
function markBackup(){try{localStorage.setItem('burger-lastbk',new Date().toLocaleString('ru-RU'))}catch(e){}}
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('burger-theme',t)}catch(e){}}
function setZoom(z){document.documentElement.style.zoom=z;try{localStorage.setItem('burger-zoom',z)}catch(e){}}
async function checkUpdate(silent){
 try{const r=await fetch('burger-app.html?_='+Date.now(),{cache:'no-store'});const t=await r.text();const m=t.match(/name="app-version" content="([^"]+)"/);const cur=document.querySelector('meta[name=app-version]').content;
  if(m&&m[1]!==cur){if(Object.keys(ui.cart).length){toast('Доступна версия '+m[1]+'. Оформите заказ и обновите');return}save();toast('Обновляю до '+m[1]+'…');setTimeout(()=>location.reload(),600)}
  else if(!silent)toast('У вас последняя версия')}catch(e){if(!silent)toast('Нет сети — проверить нельзя')}}

function A(a,d,e){const id=+d.id,v=d.v;const mk=()=>S.menu.find(x=>x.id===id);
 switch(a){
 case'tab':ui.tab=v;ui.sheet=null;return render();
 case'theme':{const dark=document.documentElement.dataset.theme==='dark'||(!document.documentElement.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);setTheme(dark?'light':'dark');return render()}
 case'zoom':setZoom(+v);return render();
 case'osub':ui.osub=v;return render();
 case'of':ui.of=v;return render();
 case'add':{const m=mk();if(!m||!m.on)return;ui.cart[id]=(ui.cart[id]||0)+1;return render()}
 case'rem':{e.stopPropagation();if(ui.cart[id]>1)ui.cart[id]--;else delete ui.cart[id];if(!Object.keys(ui.cart).length&&ui.sheet&&ui.sheet.t==='cart')ui.sheet=null;return render()}
 case'cart':ui.sheet={t:'cart'};return render();
 case'close':ui.sheet=null;return render();
 case'ckt':ui.ck.type=v;return render();
 case'ckp':ui.ck.pay=v;return render();
 case'mk':{const items=Object.keys(ui.cart).map(k=>{const m=S.menu.find(x=>x.id===+k);return m?{id:m.id,name:m.name,price:m.price,cost:dishCost(m),qty:ui.cart[k]}:null}).filter(Boolean);if(!items.length)return;
  act('Заказ создан',()=>{const n=S.seq.order++;S.orders.push({num:n,client:ui.ck.client.trim(),type:ui.ck.type,pay:ui.ck.pay,note:ui.ck.note.trim(),status:'new',items,created:Date.now(),sold:null,deducted:[]});ui.cart={};ui.ck.client='';ui.ck.note='';ui.sheet=null;ui.osub='q'});return}
 case'adv':{const o=S.orders.find(x=>x.num===id);if(!o)return;const nx=ST[ST.indexOf(o.status)+1];
  act(nx==='sold'?'Продан · склад списан':'Статус: '+STN[nx],()=>{o.status=nx;if(nx==='sold'){o.sold=Date.now();o.deducted=deductFor(o)}});return}
 case'ocancel':act('Заказ отменён',()=>{S.orders=S.orders.filter(o=>o.num!==id)});return;
 case'unsell':act('Продажа отменена · склад возвращён',()=>{const o=S.orders.find(x=>x.num===id);restore(o);o.status='ready';o.sold=null});return;
 case'sr':ui.sr=v;return render();
 case'fr':ui.fr=v;return render();
 case'hr':ui.hr=v;return render();
 case'ssub':ui.ssub=v;return render();
 case'csv':copyText(csvCopy()).then(ok=>toast(ok?'Таблица скопирована':'Не удалось скопировать'));return;
 case'demo':act('Демо-данные загружены',()=>{S=demo();ui.cart={}});return;
 case'fft':ui.ff.type=v;ui.ff.cat=v==='in'?INCAT[0]:OPEX[0];return render();
 case'ffadd':{const s=+ui.ff.sum;if(!s||s<=0){toast('Введите сумму');return}act('Операция добавлена',()=>{S.fin.push({id:S.seq.fin++,ts:Date.now(),type:ui.ff.type,cat:ui.ff.cat,note:ui.ff.note,sum:s});ui.ff.sum='';ui.ff.note=''});return}
 case'findel':act('Операция удалена',()=>{S.fin=S.fin.filter(f=>f.id!==id)});return;
 case'lossdel':act('Списание удалено',()=>{S.losses=S.losses.filter(f=>f.id!==id)});return;
 case'shclose':{const last=S.shifts.length?S.shifts[S.shifts.length-1].ts:0;const os=sold().filter(o=>o.sold>last);const cash=sum(os.filter(o=>o.pay==='cash'),oTotal),card=sum(os.filter(o=>o.pay==='card'),oTotal);
  const fl=+ui.sh.float||0,ct=ui.sh.counted===''?fl+cash:+ui.sh.counted;
  act('Смена закрыта',()=>{S.shifts.push({id:S.seq.shift++,ts:Date.now(),from:last,orders:os.length,cash,card,float:fl,expected:fl+cash,counted:ct,diff:ct-(fl+cash),note:ui.sh.note});ui.sh={float:'',counted:'',note:''}});return}
 case'mmode':ui.mmode=v;return render();
 case'dishon':act('Стоп-лист обновлён',()=>{const m=mk();m.on=!m.on;if(!m.on)delete ui.cart[m.id]});return;
 case'dishdel':act('Блюдо удалено',()=>{S.menu=S.menu.filter(m=>m.id!==id);delete ui.cart[id]});return;
 case'dishadd':{if(!ui.nd.name.trim()){toast('Введите название');return}act('Блюдо добавлено',()=>{S.menu.push({id:S.seq.menu++,em:ui.nd.em||'🍽️',name:ui.nd.name.trim(),price:+ui.nd.price||0,cost:0,on:true,tc:{time:0,steps:'',ings:[]},pack:[]});ui.nd={em:'🍽️',name:'',price:''}});return}
 case'tcopen':ui.sheet={t:'tc',id};return render();
 case'ingadd':quiet(()=>mk().tc.ings.push({name:'Новый ингредиент',qty:0,unit:'г',kcal:0,p:0,f:0,c:0,price:0,stockId:null,w:0}));return;
 case'ingdel':quiet(()=>mk().tc.ings.splice(+d.i,1));return;
 case'pkadd':quiet(()=>mk().pack.push({stockId:null,qty:1,mode:'go'}));return;
 case'pkdel':quiet(()=>mk().pack.splice(+d.i,1));return;
 case'pbatch':act('Партия добавлена',()=>{const p=S.preps.find(x=>x.id===id);const ne=endDay(Date.now()+p.shelf*DAY);p.exp=(p.qty>0&&p.exp)?Math.min(p.exp,ne):ne;p.qty=+(p.qty+p.batch).toFixed(3)});return;
 case'puse':quiet(()=>{const p=S.preps.find(x=>x.id===id);p.qty=Math.max(0,+(p.qty-prepStep(p)).toFixed(3));if(p.qty<=0)p.exp=null});return;
 case'pwaste':act('Заготовка списана',()=>{const p=S.preps.find(x=>x.id===id);if(p.qty>0)S.losses.push({id:S.seq.loss++,ts:Date.now(),name:p.name,qty:p.qty,unit:p.unit||'порц',reason:prepState(p).o<=1?'Срок годности':'Другое',sum:0});p.qty=0;p.exp=null});return;
 case'pdel':act('Заготовка удалена',()=>{S.preps=S.preps.filter(p=>p.id!==id)});return;
 case'padd':{if(!ui.np.name.trim()){toast('Введите название');return}act('Заготовка добавлена',()=>{S.preps.push({id:S.seq.prep++,name:ui.np.name.trim(),qty:0,unit:'порц',par:+ui.np.par||1,batch:+ui.np.batch||1,shelf:+ui.np.shelf||1,exp:null});ui.np={name:'',par:'',batch:'',shelf:''}});return}
 case'scat':ui.scat=v;return render();
 case'sdec':quiet(()=>{const i=stockBy(id);i.qty=Math.max(0,+(i.qty-stepOf(i.unit)).toFixed(3))});return;
 case'sinc':quiet(()=>{const i=stockBy(id);i.qty=+(i.qty+stepOf(i.unit)).toFixed(3)});return;
 case'sdel':act('Позиция удалена',()=>{S.stock=S.stock.filter(i=>i.id!==id);S.menu.forEach(m=>{m.tc.ings.forEach(g=>{if(g.stockId===id)g.stockId=null});m.pack=m.pack.filter(k=>k.stockId!==id)})});return;
 case'sadd':{if(!ui.ns.name.trim()){toast('Введите название');return}act('Позиция добавлена',()=>{S.stock.push({id:S.seq.stock++,name:ui.ns.name.trim(),qty:+ui.ns.qty||0,unit:ui.ns.unit,min:+ui.ns.min||0,cat:ui.ns.cat,price:+ui.ns.price||0});ui.ns.name='';ui.ns.qty='';ui.ns.min='';ui.ns.price=''});return}
 case'shop':ui.sheet={t:'shop'};return render();
 case'buy':act('Куплено',()=>{const i=stockBy(id),n=need(i);i.qty=+(i.qty+n).toFixed(3);if(i.price)S.fin.push({id:S.seq.fin++,ts:Date.now(),type:'out',cat:i.cat==='food'?PURCH[0]:PURCH[1],note:i.name,sum:Math.round(n*i.price)})});return;
 case'shopcopy':{const L=shopList();copyText('🛒 Список покупок\n'+L.map(x=>'• '+x.i.name+' — '+q2(x.n)+' '+x.i.unit).join('\n')).then(ok=>toast(ok?'Список скопирован':'Не удалось скопировать'));return}
 case'cats':ui.sheet={t:'cats'};return render();
 case'catdel':act('Раздел удалён',()=>{S.cats=S.cats.filter(c=>c.id!==v);if(ui.scat===v)ui.scat='all'});return;
 case'cataddgo':{const n=$('#ncn').value.trim();if(!n){toast('Введите название раздела');return}act('Раздел добавлен',()=>{S.cats.push({id:'c'+(S.seq.cat++),em:$('#nce').value.trim()||'📁',name:n})});return}
 case'swaste':ui.sheet={t:'waste',kind:'stock',id};return render();
 case'wgo':{const w=ui.sheet,it=w.kind==='stock'?stockBy(w.id):S.preps.find(p=>p.id===w.id),q=Math.min(+$('#wq').value||0,it.qty),r=$('#wr').value;if(q<=0){toast('Введите количество');return}
  ui.sheet=null;act('Списано · потери записаны',()=>{it.qty=+(it.qty-q).toFixed(3);S.losses.push({id:S.seq.loss++,ts:Date.now(),name:it.name,qty:q,unit:it.unit||'порц',reason:r,sum:Math.round(q*(it.price||0))})});return}
 case'upd':return checkUpdate(false);
 case'bkdl':{const b=new Blob([bkText()],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='burger-backup-'+isoDay(Date.now())+'.json';document.body.appendChild(a);a.click();a.remove();markBackup();toast('Файл сохранён (если браузер разрешил)');return render()}
 case'bkcopy':copyText(bkText()).then(ok=>{if(ok)markBackup();toast(ok?'Копия скопирована в буфер':'Не удалось скопировать')});return;
 case'bktxtgo':return restoreData($('#bktxt').value);
 case'reset':if(!ui.resetArm){ui.resetArm=true;render();setTimeout(()=>{ui.resetArm=false;if(ui.tab==='menu')render()},4000);return}
  ui.resetArm=false;act('Все данные сброшены',()=>{S=norm(blank());ui.cart={}});return}}

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b){if(b.disabled)return;A(b.dataset.a,b.dataset,e);return}
 if(e.target.id==='sheet'){ui.sheet=null;render()}});
const NUMK=new Set(['price','cost','qty','min','par','batch','shelf','kcal','p','f','c','w','time']);
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='bkfile'){const f=t.files[0];if(f)f.text().then(restoreData);return}
 const c=t.dataset.c;if(!c)return;const k=t.dataset.k,id=+t.dataset.id,i=+t.dataset.i;let v=t.value;if(NUMK.has(k))v=+v||0;
 const mk=()=>S.menu.find(x=>x.id===id);
 switch(c){
  case'ff':case'nd':case'ns':case'np':case'sh':case'ck':ui[c==='ff'?'ff':c==='sh'?'sh':c==='ck'?'ck':c][k]=t.value;if(c==='sh')render();return;
  case'm':mk()[k]=v;save();return render();
  case'ing':{const g=mk().tc.ings[i];g[k]=k==='stockId'?(v?+v:null):v;if(k==='stockId'&&v){const s=stockBy(+v);if(s&&s.price&&!g.price)g.price=g.unit==='шт'?s.price:s.price}save();return render()}
  case'pk':{const g=mk().pack[i];g[k]=k==='stockId'?(v?+v:null):v;save();return render()}
  case'tc':mk().tc[k]=v;save();return k==='time'?undefined:undefined;
  case'st':{const s=stockBy(id);s[k]=k==='cat'?t.value:v;save();return render()}
  case'pr':{const p=S.preps.find(x=>x.id===id);if(k==='exp'){p.exp=t.value?endDay(new Date(t.value+'T12:00:00').getTime()):null}else p[k]=v;save();return render()}
 }});

/* ===== запуск ===== */
(function init(){
 try{const th=localStorage.getItem('burger-theme');if(th)document.documentElement.dataset.theme=th;const z=localStorage.getItem('burger-zoom');if(z)document.documentElement.style.zoom=z}catch(e){}
 render();
 setInterval(()=>{if(ui.tab==='orders'&&!ui.sheet&&!document.activeElement.matches('input,textarea,select'))render()},30000);
 if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
 setTimeout(()=>checkUpdate(true),1500);
})();
</script>
